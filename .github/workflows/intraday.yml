name: Live Intraday Alerts

on:
  schedule:
    # Every 30 min on weekdays, covering both sessions across daylight saving:
    #   ASX    10:00-16:00 Sydney     = 00:00-06:00 UTC (AEST) / 23:00-05:00 UTC (AEDT)
    #   NASDAQ 09:30-16:00 New York   = 13:30-20:00 UTC (EDT)  / 14:30-21:00 UTC (EST)
    # intraday_scanner.py and live_prices.py self-guard with pytz (is_asx_open /
    # is_nasdaq_open), so ticks just outside a session are ~30s no-ops.
    # Previous window was '2-21' -- that's Perth AWST (UTC+8), not the ASX's own
    # Sydney time, so it clipped the first 2h of every ASX session.
    - cron: '0,30 0-6,13-23 * * 1-5'
  workflow_dispatch:

concurrency:
  group: intraday-scan
  cancel-in-progress: false

jobs:
  intraday-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10  # fires every 30 min -- a hung run must die well before the next tick
    permissions:
      contents: write  # needed to push alerts/live-price data to repo
    env:
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run intraday scanner
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          REPORT_EMAIL: ${{ secrets.REPORT_EMAIL }}
        run: python src/intraday_scanner.py

      - name: Write live prices snapshot
        run: python src/live_prices.py

      - name: Write live Day-Buy ideas scan
        run: python src/live_ideas.py

      - name: Save alerts log
        run: |
          git config user.name "Trading Analyser Bot"
          git config user.email "bot@trading-analyser"
          git pull --rebase origin main || true
          # Separate `git add` calls, not one combined line: alerts_log.json and
          # entry_cross_alerts.json only get created when an alert actually fires,
          # so most runs don't have them on disk at all. `git add a b c d` aborts
          # staging ALL of them the moment any single path doesn't exist -- which
          # was silently blocking live_prices.json/live_ideas.json from ever being
          # staged even though they always have real, fresh content every run.
          git add data/alerts_log.json || true
          git add data/entry_cross_alerts.json || true
          git add data/live_prices.json || true
          git add data/live_ideas.json || true
          git diff --staged --quiet || git commit -m "Alerts log $(date -u +%H:%M)"
          git push origin HEAD:main || (git pull --rebase origin main && git push origin HEAD:main)
