name: Agent Trader Scan

on:
  schedule:
    # Every 5 min during ASX hours: 10:00am-4:00pm AEST = 00:00-06:00 UTC
    - cron: '*/5 0-6 * * 1-5'
  workflow_dispatch:

concurrency:
  group: agent-scan
  cancel-in-progress: false  # queue behind a still-running scan rather than overlap it

jobs:
  agent-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 4  # this fires every 5 min -- a hung run must die well before the next tick
    permissions:
      contents: write
    env:
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run agent scan
        run: python src/agent_trader.py

      - name: Commit results
        run: |
          git config user.name "Agent Trader Bot"
          git config user.email "agent@trading-analyser"
          git pull --rebase origin main || true
          git add data/agent_trades.json data/portfolio.json
          git diff --staged --quiet || git commit -m "Agent scan $(date -u +'%H:%M UTC')"
          git push origin HEAD:main || (git pull --rebase origin main && git push origin HEAD:main)
