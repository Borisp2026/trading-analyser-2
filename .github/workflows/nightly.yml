name: Nightly Trading Report

on:
  schedule:
    # 6pm AWST = 10:00 UTC (Perth is UTC+8, no DST) -- weekdays only, ASX is closed weekends
    - cron: '0 10 * * 1-5'
  workflow_dispatch:  # allow manual run from Actions tab

# Two runs landing minutes apart (a manual dispatch racing the schedule, or two
# manual triggers back to back) was confirmed to corrupt index.html: a rebase
# merge on a ~12MB file with no line-level overlap between two versions can
# silently resurrect long-deleted content instead of flagging a conflict --
# found this exact failure mode happening for real (an old, fully-removed
# corsproxy.io code path reappeared in a committed build). Every other
# git-committing workflow in this repo already serializes its own runs the
# same way; this one didn't.
concurrency:
  group: nightly-build
  cancel-in-progress: false

jobs:
  run-report:
    runs-on: ubuntu-latest
    timeout-minutes: 25  # fail loudly instead of silently hanging for hours (default cap is 6h)
    permissions:
      contents: write  # needed to push dashboard to repo
    env:
      PYTHONUNBUFFERED: "1"  # stream print() output live instead of buffering it until the process exits

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run macro gate
        run: python src/macro_gate.py
      - name: Run nightly analyser
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          REPORT_EMAIL: ${{ secrets.REPORT_EMAIL }}
        run: python src/analyser.py
      - name: Build dashboard
        run: python src/build_dashboard.py

      - name: Commit dashboard and reports
        run: |
          git config user.name "Trading Analyser Bot"
          git config user.email "bot@trading-analyser"
          git pull --rebase origin main || true
          git add reports/ index.html data/macro_gate.json data/signal_history.json data/agent_trades.json data/portfolio.json data/cycle_signals.json data/quant_results.json data/intraday_results.json data/zen_signals.json
          git diff --staged --quiet || git commit -m "Nightly report $(date -u +%Y-%m-%d)"
          # index.html is a fully-generated, ~12MB, near-single-line build artifact --
          # there's never a legitimate reason to 3-way-merge it. Confirmed this
          # actually happened: a 2-month-old commit ("Restore index.html from last
          # nightly") sits in main's history holding a stale index.html, and a plain
          # `git pull --rebase` retry on conflict can silently resurrect fragments of
          # it via git's line-level auto-merge instead of flagging a conflict -- found
          # a fully-dead, already-removed client-side feature reappear in a committed
          # build this way. On a push conflict, reset onto the latest origin and
          # re-commit this run's actual on-disk output wholesale instead of asking git
          # to reconcile two versions of the same generated file.
          git push origin HEAD:main || (git fetch origin main && git reset --soft origin/main && git commit --allow-empty -m "Nightly report $(date -u +%Y-%m-%d)" && git push origin HEAD:main)
