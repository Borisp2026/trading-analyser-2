name: AI Position Assessment

on:
  schedule:
    # Hourly on weekdays across both sessions. Kept separate from market_pulse
    # because this one spends ANTHROPIC_API_KEY per run -- don't fold it into a
    # 15-min loop. Window matches market_pulse: ASX 00-06 UTC (Sydney time, not
    # the Perth AWST the old '2-21' assumed) + NASDAQ 13-23 UTC, both DST states.
    - cron: '0 0-6,13-23 * * 1-5'
  workflow_dispatch:

concurrency:
  group: ai-assessment
  cancel-in-progress: false

jobs:
  ai-assessment:
    runs-on: ubuntu-latest
    timeout-minutes: 5  # this is a single short Claude call, not a full scan -- should never take long
    permissions:
      contents: write
    env:
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run AI assessment
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python src/ai_assessment.py

      - name: Commit results
        run: |
          git config user.name "AI Assessment Bot"
          git config user.email "ai-assessment@trading-analyser"
          git pull --rebase origin main || true
          git add data/ai_assessment.json
          git diff --staged --quiet || git commit -m "AI assessment $(date -u +'%H:%M UTC')"
          git push origin HEAD:main || (git pull --rebase origin main && git push origin HEAD:main)
